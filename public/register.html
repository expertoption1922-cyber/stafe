<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>إنشاء حساب جديد</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
    <script defer src="/app.js"></script>
  </head>
  <body data-page="register">
    <div class="auth-shell auth-shell--alt">
      <div class="auth-card auth-card--register">
        <div class="auth-brand">
          <div class="brand-mark">S</div>
          <div>
            <h1>نظام إدارة الموظفين في قسم تجهيز المجنح</h1>
            <p>Employee Management System</p>
          </div>
        </div>

        <div class="auth-layout">
          <section class="auth-panel auth-panel--info">
            <span class="eyebrow eyebrow--dark">مرحبًا بك</span>
            <h2>إنشاء حساب جديد</h2>
            <p>أنشئ حسابك للوصول إلى نظام إدارة الموظفين في قسم تجهيز المجنح بسهولة وأمان.</p>
            <div class="feature-list">
              <div><span>✓</span> إدارة البيانات في مكان واحد</div>
              <div><span>✓</span> صلاحيات واضحة وممنهجة</div>
              <div><span>✓</span> وصول سريع ومتجاوب</div>
            </div>
          </section>

          <section class="auth-panel auth-panel--form">
            <div class="auth-header-inline">
              <h3>إنشاء حساب</h3>
            </div>

            <form id="registerForm" class="auth-form" novalidate>
              <div class="field-group">
                <label for="registerName">الاسم الكامل</label>
                <div class="input-wrap">
                  <span class="input-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="8" r="4"/></svg>
                  </span>
                  <input id="registerName" type="text" name="name" placeholder="أدخل اسمك كاملاً" required />
                </div>
              </div>

              <div class="field-group">
                <label for="registerEmail">البريد الإلكتروني</label>
                <div class="input-wrap">
                  <span class="input-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5h11A2.5 2.5 0 0 1 20 7.5v9A2.5 2.5 0 0 1 17.5 19h-11A2.5 2.5 0 0 1 4 16.5v-9Z"/><path d="m5 7 7 5 7-5"/></svg>
                  </span>
                  <input id="registerEmail" type="email" name="email" placeholder="name@example.com" required />
                </div>
              </div>

              <div class="field-group">
                <label for="registerPassword">كلمة المرور</label>
                <div class="input-wrap">
                  <span class="input-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
                  </span>
                  <input id="registerPassword" type="password" name="password" placeholder="••••••••" required />
                  <button type="button" class="password-toggle" aria-label="عرض كلمة المرور">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                  </button>
                </div>
              </div>

              <div class="field-group">
                <label for="registerConfirmPassword">تأكيد كلمة المرور</label>
                <div class="input-wrap">
                  <span class="input-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
                  </span>
                  <input id="registerConfirmPassword" type="password" name="confirmPassword" placeholder="أعد كتابة كلمة المرور" required />
                  <button type="button" class="password-toggle" aria-label="عرض كلمة المرور">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                  </button>
                </div>
              </div>

              <button id="registerSubmit" type="submit" class="btn btn-primary btn-block">إنشاء الحساب</button>
              <p class="auth-switch">
                لديك حساب بالفعل؟
                <a href="/login">تسجيل الدخول</a>
              </p>
            </form>
          </section>
        </div>
      </div>
    </div>

    <div id="toast" class="toast"></div>
  </body>
</html>
